name: Supabase Industrial Migrations

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-migrations.yml'

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: List migrations
        run: |
          echo "Migrations em supabase/migrations:"
          ls -1 supabase/migrations/*.sql | sort

      - name: Apply migrations (Postgres direct)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_REGION: eu-central-1
        run: node scripts/applyMigrationsPg.mjs

      - name: Verify industrial tables (REST)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          API_KEY="${SUPABASE_SERVICE_ROLE_KEY:-$VITE_SUPABASE_ANON_KEY}"
          if [ -z "$API_KEY" ]; then
            echo "ERRO: VITE_SUPABASE_ANON_KEY ou SUPABASE_SERVICE_ROLE_KEY em falta para verificação."
            exit 1
          fi
          TABLES=(
            industrial_work_orders
            industrial_work_order_tasks
            industrial_work_order_events
            industrial_piece_operations
            industrial_piece_quality
            industrial_piece_time_entries
            system_settings
            system_events
          )
          for table in "${TABLES[@]}"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "apikey: ${API_KEY}" \
              -H "Authorization: Bearer ${API_KEY}" \
              "${VITE_SUPABASE_URL}/rest/v1/${table}?limit=1")
            echo "${table} -> HTTP ${code}"
            if [ "$code" != "200" ]; then
              echo "ERRO: tabela ${table} inacessível"
              exit 1
            fi
          done
          VIEWS=(
            industrial_operations
            industrial_quality
            industrial_time_tracking
            industrial_work_order_tasks_view
            industrial_tracking
            industrial_rework
            industrial_events
            industrial_settings
          )
          for view in "${VIEWS[@]}"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "apikey: ${API_KEY}" \
              -H "Authorization: Bearer ${API_KEY}" \
              "${VITE_SUPABASE_URL}/rest/v1/${view}?limit=1")
            echo "${view} -> HTTP ${code}"
            if [ "$code" != "200" ]; then
              echo "ERRO: view ${view} inacessível"
              exit 1
            fi
          done
