name: Deploy via SFTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Prepare Git for version bump
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "ci: auto commit before version bump" || echo "no changes"

      - name: Auto bump version
        run: |
          npm version patch
          git push --follow-tags

      - name: Build
        run: npm run build

      # SFTP (porta 22). Secrets: FTP_HOST, FTP_USERNAME, FTP_PASSWORD. Se a Hostinger usar outra porta (ex.: 2222), adicione secret FTP_PORT e altere a linha port abaixo para: port: ${{ secrets.FTP_PORT }}
      - name: Upload via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_path: './dist/*'
          remote_path: '/public_html/'
          sftp_only: true
          delete_remote_files: true
          sftpArgs: '-o ConnectTimeout=30 -o StrictHostKeyChecking=no'