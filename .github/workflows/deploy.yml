
name: Publish and Deploy

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build_deploy:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.meta.outputs.version }}
      version_source: ${{ steps.meta.outputs.source }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: "npm"

      - name: Resolve version metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "source=tag" >> "$GITHUB_OUTPUT"
          else
            VERSION="$(node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('version.json','utf8')); process.stdout.write(data.version || 'unknown');")"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "source=version.json" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved version: $(cat "$GITHUB_OUTPUT" | tr '\n' ' ')"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pimo-dist-${{ github.run_number }}
          path: |
            dist/**
            version.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: dist/
          server-dir: /public_html/
          # N├úo apagar no servidor ficheiros que n├úo existem em dist/ (dados persistentes).
          dangerous-clean-slate: false
          # Preserva JSON de projectos no servidor (legacy project-*.json e {nome}.json); PHP enviado pelo build.
          exclude: |
            **/textures/**
            **/api/data/**
            **/api/projects/data/*.json
            **/api/materials/**




