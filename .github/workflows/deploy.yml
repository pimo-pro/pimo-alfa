
name: Publish and Deploy

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build_deploy:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.meta.outputs.version }}
      version_source: ${{ steps.meta.outputs.source }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: "npm"

      - name: Resolve version metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "source=tag" >> "$GITHUB_OUTPUT"
          else
            VERSION="$(node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('version.json','utf8')); process.stdout.write(data.version || 'unknown');")"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "source=version.json" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved version: $(cat "$GITHUB_OUTPUT" | tr '\n' ' ')"

      - name: Install dependencies
        run: npm ci

      - name: Prepare production env
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          cat > .env.production <<EOF
          VITE_API_URL=https://pimo.pro
          VITE_TEXTURES_URL=https://pimo.pro/textures
          VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
          VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
          EOF

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pimo-dist-${{ github.run_number }}
          path: |
            dist/**
            version.json
          if-no-files-found: error
          retention-days: 14

      # FULL CLEAN dos artefactos frontend no servidor (public_html = conteúdo de dist/).
      # Não usa dangerous-clean-slate (apagaria textures/api data). Preserva dados persistentes.
      - name: Clean remote stale frontend assets
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp -c "
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:max-retries 3;
            set net:timeout 30;
            open -u \"${FTP_USERNAME}\",\"${FTP_PASSWORD}\" ftp://${FTP_HOST};
            cd public_html;
            glob -a rm -r assets;
            glob -a rm -r industrial;
            rm -f .ftp-deploy-sync-state.json;
            rm -f *.js.map;
            bye
          "
          echo "Remote clean done: assets/, industrial/, sync-state, *.js.map"

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: dist/
          server-dir: /public_html/
          # Nao usar true: apagaria textures e dados API persistentes.
          dangerous-clean-slate: false
          # Preserva JSON de projectos no servidor (legacy project-*.json e {nome}.json); PHP enviado pelo build.
          exclude: |
            **/textures/**
            **/api/data/**
            **/api/projects/data/*.json
            **/api/materials/**




