<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Pimo</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0d0d0d;
      }

      .pi-loader-overlay {
        position: fixed;
        inset: 0;
        background: #0d0d0d;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        opacity: 1;
      }

      .pi-spinner-wrap {
        position: relative;
        width: 140px;
        height: 140px;
      }

      .pi-symbol {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Georgia, serif;
        font-size: 52px;
        font-weight: bold;
        background: linear-gradient(
          135deg,
          #f5a623 0%,
          #f0534a 35%,
          #9b59b6 55%,
          #1abc9c 75%,
          #2e86de 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        filter: drop-shadow(0 0 12px rgba(240, 83, 74, 0.5));
        animation: pi-breathe 2.4s ease-in-out infinite;
        z-index: 3;
      }

      @keyframes pi-breathe {
        0%,
        100% {
          transform: scale(1);
          filter: drop-shadow(0 0 10px rgba(240, 83, 74, 0.4));
        }
        50% {
          transform: scale(1.12);
          filter: drop-shadow(0 0 22px rgba(26, 188, 156, 0.65));
        }
      }

      .pi-ring {
        position: absolute;
        border-radius: 50%;
        animation: pi-spin var(--spd) linear infinite;
        animation-direction: var(--dir, normal);
      }

      @keyframes pi-spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      .pi-ring.r1 {
        --spd: 6s;
        --dir: normal;
        inset: 10px;
      }
      .pi-ring.r2 {
        --spd: 9s;
        --dir: reverse;
        inset: -6px;
      }
      .pi-ring.r3 {
        --spd: 12s;
        --dir: normal;
        inset: -22px;
      }

      .pi-digit {
        position: absolute;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: flex-start;
        justify-content: center;
      }

      .pi-digit span {
        display: block;
        font-family: Georgia, serif;
        font-weight: 600;
        line-height: 1;
        animation: pi-pulse var(--spd) linear infinite;
        animation-delay: var(--dl, 0s);
      }

      @keyframes pi-pulse {
        0%,
        100% {
          opacity: 0.3;
          transform: scale(0.85);
        }
        50% {
          opacity: 1;
          transform: scale(1.25);
        }
      }

      .r1 .pi-digit:nth-child(n) {
        --dl: calc(-0.5s * var(--i));
        transform: rotate(calc(30deg * var(--i)));
      }
      .r1 .pi-digit span {
        color: #f5a623;
        font-size: 13px;
      }

      .r2 .pi-digit:nth-child(n) {
        --dl: calc(-0.4s * var(--i));
        transform: rotate(calc(22.5deg * var(--i)));
      }
      .r2 .pi-digit span {
        color: #9b59b6;
        font-size: 12px;
      }

      .r3 .pi-digit:nth-child(n) {
        --dl: calc(-0.3s * var(--i));
        transform: rotate(calc(18deg * var(--i)));
      }
      .r3 .pi-digit span {
        color: #2e86de;
        font-size: 11px;
      }

      .pi-loader-text {
        margin-top: 1.6rem;
        font-family: Georgia, serif;
        font-size: 14px;
        letter-spacing: 0.14em;
        background: linear-gradient(
          90deg,
          #f5a623,
          #f0534a,
          #9b59b6,
          #1abc9c,
          #2e86de,
          #f5a623
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        background-size: 300%;
        animation: pi-shimmer 3s linear infinite;
      }

      @keyframes pi-shimmer {
        0% {
          background-position: 0%;
        }
        100% {
          background-position: 300%;
        }
      }
    </style>
  </head>
  <body>
    <div class="pi-loader-overlay">
      <div class="pi-spinner-wrap">
        <div class="pi-symbol">π</div>
        <div class="pi-ring r1"></div>
        <div class="pi-ring r2"></div>
        <div class="pi-ring r3"></div>
      </div>
      <div class="pi-loader-text">A carregar…</div>
    </div>

    <script>
      (function () {
        var ring1 = [3, 1, 4, 1, 5, 9, 2, 6, 5, 3, 5, 8];
        var ring2 = [9, 7, 9, 3, 2, 3, 8, 4, 6, 2, 6, 4, 3, 3, 8, 3];
        var ring3 = [2, 7, 9, 5, 0, 2, 8, 8, 4, 1, 9, 7, 1, 6, 9, 3, 9, 9, 3, 7];

        function fillRing(selector, digits) {
          var ringEl = document.querySelector(selector);
          if (!ringEl) return;
          for (var i = 0; i < digits.length; i += 1) {
            var digitEl = document.createElement("div");
            digitEl.className = "pi-digit";
            digitEl.style.setProperty("--i", String(i));

            var spanEl = document.createElement("span");
            spanEl.textContent = String(digits[i]);

            digitEl.appendChild(spanEl);
            ringEl.appendChild(digitEl);
          }
        }

        fillRing(".pi-ring.r1", ring1);
        fillRing(".pi-ring.r2", ring2);
        fillRing(".pi-ring.r3", ring3);
      })();
    </script>
  </body>
</html>
